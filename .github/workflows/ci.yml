name: Swift CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Package (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift & Xcode version
        run: |
          swift --version
          xcodebuild -version

      - name: Build Debug
        run: swift build -v

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build & Package DMG Installer
        run: |
          chmod +x build.sh
          ./build.sh --no-open --dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaggleBar-DMG
          path: KaggleBar.dmg
